<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-Frame</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0%;
            padding: 0%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1220;
            color: white;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            width: 100%;
            min-height: calc(100vh - 60px);
            display: flex;

        }

        .sidebar {
            width: 250px;
            padding: 35px 20px;
            border-right: 1px solid #26344d;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .sidebar a {
            width: 100%;
            padding: 14px 10px;
            text-align: center;
            text-decoration: none;
            color: white;
            background: #102a52;
            border: 1px solid black;
            font-size: 16px;
            transition: 0.2s;
            border-radius: 30px;

        }

        .sidebar a:hover {
            background: #163b79;
            border-color: #3d6eaa;
            transform: translateY(-2px);
        }

        .content {
            flex: 1;
            min-height: calc(100vh - 60px);
        }

        .content iframe {
            width: 100%;
            height: 100%;
            min-height: calc(100vh - 60px);
            border: none;
            background: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <a href="Project 1/Project_1.html" target="contentFrame">Project 1</a>
            <a href="Project_2.html" target="contentFrame">Project 2</a>

            <a href="Project_3.html" target="contentFrame">Project 3</a>

            <a href="Project 4/Project_4.html" target="contentFrame">Project 4</a>
            <a href="Project_5.html" target="contentFrame">Project 5</a>
            <a href="Project 6/Project_6.html" target="contentFrame">Project 6</a>
              <a href="Project_7.html" target="contentFrame">Project 7</a> 
               <a href="Project_9.html" target="contentFrame">Project 9</a>



        </div>
        <div class="content">
            <iframe name="contentFrame" src="Assignment 1.html" title=""></iframe>
        </div>
    </div>
</body>

</html>
