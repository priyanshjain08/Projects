<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .con {
            height: 1000px;
            border: 1px solid black;
            display: flex;
        }

        .box {
            height: 100%;
            width: 25%;
            border: 1px solid black;
            flex: 25%;
            
        }

        h1 {
            text-align: center;
        }

        img {
            width: 100%;
        }
    </style>
</head>

<body>
    <h1>Dynamic Gallery</h1>
    <div class="con">
        <div class="box">
            <img src="Capture.PNG" alt="">
            <img src="photo.jpg" alt="">
            <img src="Capture.PNG" alt="">
            <img src="photo2.jpg" alt="">





        </div>

        <div class="box">
            <img src="Capture.PNG" alt="">
            <img src="photo.jpg" alt="">
            
            <img src="photo2.jpg" alt="">
            <img src="Capture.PNG" alt="">
        </div>



        <div class="box">
            <img src="photo.jpg" alt="">
            <img src="Capture.PNG" alt="">
            
            <img src="Capture.PNG" alt="">
            <img src="photo2.jpg" alt="">
        </div>



        <div class="box">
            <img src="photo2.jpg" alt="">
            <img src="Capture.PNG" alt="">
            <img src="photo.jpg" alt="">
            <img src="Capture.PNG" alt="">
            
        </div>



    </div>
</body>

</html>
