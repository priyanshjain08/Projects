<!DOCTYPE html>
<html>

<head>
    <title>Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: linear-gradient(45deg, rgb(104, 179, 226), purple);

            font-family: Arial;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .login-box {
            width: 400px;

            padding: 40px;

            background-color: white;
            border-radius: 20px;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin-top: 25px;
            font-size: 16px;
        }

        input[type="text"],
        input[type="date"],
        input[type="tel"],
        input[type="email"],
        input[type="password"],
        textarea {
            width: 100%;

            padding: 10px;
            margin-top: 7px;

            font-size: 14px;
            font-family: Arial;
        }

        input[type="text"],
        input[type="date"],
        input[type="tel"],
        input[type="email"],
        input[type="password"] {
            height: 42px;
        }

        textarea {
            resize: vertical;
        }

        /* Name row */
        .name-row {
            display: flex;
            gap: 15px;
        }

        .name-row .field {
            flex: 1;
        }

        /* Gender + Photo row */
        .top-row {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .gender-group {
            flex: 1;
        }

        .photo-group {
            flex: none;
        }

        .gender-row {
            display: flex;
            gap: 20px;
            margin-top: 7px;
        }

        .gender-box {
            display: flex;
            align-items: center;
            gap: 6px;

            font-size: 13px;
            cursor: pointer;
        }

        .gender-box input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;

            width: 18px;
            height: 18px;

            border: 2px solid rgb(104, 179, 226);
            border-radius: 50%;

            margin: 0;
            cursor: pointer;
        }

        .gender-box input[type="radio"]:checked {
            background-color: purple;
            border-color: purple;
        }

        /* Photo upload */
        .photo-upload {
            width: 120px;
            height: 120px;

            margin-top: 7px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;

            border: 2px dashed rgb(104, 179, 226);
            border-radius: 8px;

            padding: 6px;
        }

        .photo-upload svg {
            width: 52px;
            height: 52px;
        }

        .photo-upload img.preview {
            display: none;
            width: 100%;
            height: 76px;
            object-fit: cover;
            border-radius: 6px;
        }

        .photo-upload input[type="file"] {
            width: 100%;
            font-size: 10px;
        }

        /* Terms and conditions */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;

            margin-top: 25px;

            font-size: 14px;
        }

        .terms input {
            margin-top: 3px;
            accent-color: purple;
            width: 16px;
            height: 16px;
        }

        .terms a {
            color: skyblue;
            text-decoration: none;
        }

        /* Register Button */
        .button {
            height: 45px;
            width: 60%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 35px auto 0;

            background: linear-gradient(45deg,
                    rgb(104, 179, 226),
                    purple);

            border: none;
            border-radius: 0;

            color: white;
            font-size: 16px;
            font-family: Arial;
            text-decoration: none;

            cursor: pointer;
        }

        /* Login link */
        .signup {
            text-align: center;

            font-size: 14px;

            margin-top: 25px;
        }

        .signup a {
            color: skyblue;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Sign Up</h2>

        <form>

            <div class="name-row">
                <div class="field">
                    <label>First Name</label>
                    <input type="text" placeholder="Enter first name">
                </div>
                <div class="field">
                    <label>Last Name</label>
                    <input type="text" placeholder="Enter last name">
                </div>
            </div>

            <div class="top-row">
                <div class="gender-group">
                    <label>Gender</label>
                    <div class="gender-row">
                        <label class="gender-box">
                            <input type="radio" name="gender" value="male">
                            Male
                        </label>
                        <label class="gender-box">
                            <input type="radio" name="gender" value="female">
                            Female
                        </label>
                    </div>
                </div>
                <div class="photo-group">
                    <label>Photo</label>
                    <div class="photo-upload">
                        <svg id="photo-icon" viewBox="0 0 24 24" fill="none" stroke="rgb(104, 179, 226)"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
                        </svg>
                        <img id="photo-preview" class="preview" alt="Photo preview">
                        <input type="file" accept="image/*" onchange="previewPhoto(this)">
                    </div>
                </div>
            </div>

            <label>Date of Birth</label>
            <input type="date">

            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter mobile number">

            <label>Address</label>
            <textarea rows="2" placeholder="Enter your address"></textarea>

            <label>Email</label>
            <input type="email" placeholder="Enter email">

            <label>Confirm Email</label>
            <input type="email" placeholder="Re-enter email">

            <label>Password</label>
            <input type="password" placeholder="Enter password">

            <label>Confirm Password</label>
            <input type="password" placeholder="Re-enter password">

            <div class="terms">
                <input type="checkbox">
                <label style="margin:0; font-size:14px;">
                    I agree to the <a href="#">terms and conditions</a>
                </label>
            </div>

            <a href="login-form.html" class="button">Sign Up</a>

        </form>

        <p class="signup">
            Already a member?
            <a href="login-form.html">Login</a>
        </p>

    </div>

</body>

</html>
