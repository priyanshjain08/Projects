<!DOCTYPE html>
<html>

<head>
    <title>Login Form</title>

    <style>
        /* @media screen and (orientation: portrait){
            
        }
       
        * */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: linear-gradient(45deg, rgb(104, 179, 226), purple);

            font-family: Arial;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 360px;
            height: 480px;

            padding: 40px;

            background-color: white;
            border-radius: 20px;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin-top: 25px;
            font-size: 16px;
        }

        input {
            width: 100%;
            height: 42px;

            padding: 10px;
            margin-top: 7px;

            font-size: 14px;

        }

        /* Forgot Password */
        .forgot-password {
            display: block;

            margin-top: 8px;

            text-align: left;

            color: skyblue;
            text-decoration: none;

            font-size: 14px;
        }

        /* Login Button */
        .button {
            height: 45px;
            width: 60%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 35px auto 0;

            background: linear-gradient(45deg,
                    rgb(104, 179, 226),
                    purple);

            border-radius: 0;

            color: white;
            text-decoration: none;

            font-size: 16px;
        }


        /* Login Button
        .button {
            height: 45px;
            width: 60%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 35px auto 0;

            background: linear-gradient(
                45deg,
                rgb(104, 179, 226),
                purple
            );

            border-radius: 0;
        } */

        .button a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        /* Sign Up */
        .signup {
            text-align: center;

            font-size: 14px;

            margin-top: 25px;
        }

        .signup a {
            color: skyblue;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login Form</h2>

        <label>Email or Username</label>
        <input type="text" placeholder="Enter username">

        <label>Password</label>
        <input type="password" placeholder="Enter password">

        <a href="forgot-password.html" class="forgot-password">
            Forgot password?
        </a>

        <a href="form-login.html" class="button">
            Login
        </a>

        <!-- <div class="button">
            <a href="login1.html">Login</a>
        </div> -->

        <p class="signup">
            Not a member?
            <a href="sign_up.html">Sign up now</a>
        </p>

    </div>

</body>

</html>
